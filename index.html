<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4FB">
<title>Roy Stores</title>
<link rel="icon" href="Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2745; --ink2:#55607F; --mist:#F6F4FB; --line:#E6E2F1;
  --teal:#14B8D0; --blue:#2F7DE1; --magenta:#D6337F; --amber:#F2A33A;
  --ok:#16915F; --bad:#D3403A;
  --font-h:"Baloo Da 2","Hind Siliguri",system-ui,sans-serif;
  --font-b:"Hind Siliguri","Baloo Da 2",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font-b);color:var(--ink);background:var(--mist);min-height:100svh;overflow-x:hidden;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
a{-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:10px}
[hidden]{display:none!important}

/* ---------- animated 3D background ---------- */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora{position:absolute;border-radius:50%;opacity:.6;animation:drift 22s ease-in-out infinite alternate}
.a1{width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:radial-gradient(circle,#BFEFF6 0,transparent 65%)}
.a2{width:60vmax;height:60vmax;right:-20vmax;top:10vmax;background:radial-gradient(circle,#FBD3E6 0,transparent 65%);animation-delay:-8s}
.a3{width:60vmax;height:60vmax;left:10vmax;bottom:-35vmax;background:radial-gradient(circle,#FDE6BE 0,transparent 65%);animation-delay:-14s}
@keyframes drift{to{transform:translate3d(6vmax,4vmax,0) scale(1.15)}}
.yarn{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);will-change:transform;
  transform:translate3d(calc(var(--mx,0)*var(--d)*1px),calc(var(--my,0)*var(--d)*1px),0);transition:transform .35s ease-out,opacity .7s}
.yarn.s{opacity:0}
body:not(.home) .yarn.s{opacity:.55}
body:not(.home) .yarn.h{opacity:0}
.bob{position:relative;width:100%;height:100%;animation:bob var(--t,8s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-26px) rotate(3deg)}}
.ball{position:relative;width:var(--bs,100%);height:var(--bs,100%);border-radius:50%;overflow:hidden;box-shadow:0 34px 40px -26px rgba(27,39,69,.45)}
.wool{position:absolute;inset:-25%;animation:spin var(--sp,40s) linear infinite;
  background:
   repeating-linear-gradient(28deg,transparent 0 5px,rgba(20,20,60,.18) 5px 6.5px),
   repeating-linear-gradient(-52deg,transparent 0 7px,rgba(255,255,255,.3) 7px 9px),
   repeating-linear-gradient(80deg,transparent 0 11px,var(--c2) 11px 14px),
   var(--c1)}
.ball::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.8) 0 5%,transparent 28%),radial-gradient(circle at 70% 78%,rgba(20,20,60,.36),transparent 60%);
  box-shadow:inset -14px -18px 30px rgba(20,20,60,.3),inset 8px 10px 18px rgba(255,255,255,.22)}
@keyframes spin{to{transform:rotate(360deg)}}
.thread{position:absolute;left:58%;top:74%;width:110%;height:70%;overflow:visible}
.thread path{fill:none;stroke:var(--c1);stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke}
.spark{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);background:var(--c);
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:twinkle 3.4s ease-in-out infinite;animation-delay:var(--dl)}
@keyframes twinkle{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1) rotate(45deg);opacity:1}}

#app{position:relative;z-index:1}

/* ---------- home ---------- */
.home{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(16px + env(safe-area-inset-top)) 20px calc(18px + env(safe-area-inset-bottom));text-align:center}
.home>*:not(.threads){position:relative;z-index:1}
.threads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.th{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:.85;animation:draw 3.4s .3s ease-out forwards}
.th.t2{animation-delay:.9s}
@keyframes draw{to{stroke-dashoffset:0}}
.home-top{width:100%;display:flex;justify-content:flex-end}
.home-mid{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px 0}
.logo-stage{perspective:900px}
.logo-float{position:relative;animation:logoIn 1.1s .35s cubic-bezier(.2,.9,.25,1.2) backwards,bobLogo 6s 1.5s ease-in-out infinite}
@keyframes logoIn{from{opacity:0;transform:translateY(60px) rotateX(70deg) scale(.6)}}
@keyframes bobLogo{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.logo-float::after{content:"";position:absolute;left:12%;right:12%;bottom:-38px;height:22px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(27,39,69,.28),transparent 70%);animation:shadowP 6s 1.5s ease-in-out infinite}
@keyframes shadowP{0%,100%{transform:scale(1)}50%{transform:scale(.8);opacity:.7}}
.orbit{position:absolute;inset:-16%;border-radius:50%;border:2px dashed rgba(27,39,69,.18);animation:spin 36s linear infinite;z-index:-1}
.orbit i{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px rgba(255,255,255,.75)}
.logo-card{width:min(64vw,300px);aspect-ratio:1;border-radius:44px;background:#fff;display:grid;place-items:center;transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;
  box-shadow:0 40px 60px -32px rgba(27,39,69,.5),0 4px 14px rgba(27,39,69,.08)}
.logo-card img{width:86%;height:auto;transform:translateZ(36px);
  -webkit-mask-image:radial-gradient(closest-side,#000 86%,transparent 100%);mask-image:radial-gradient(closest-side,#000 86%,transparent 100%)}
.welcome{font-family:var(--font-h);font-weight:800;font-size:clamp(2rem,7.4vw,3.5rem);line-height:1.08;letter-spacing:-.01em;perspective:600px;margin-top:14px}
.welcome .w{display:inline-block;white-space:nowrap}
.welcome .l{display:inline-block;transform-origin:50% 100%;animation:flip .8s cubic-bezier(.2,.9,.3,1.3) backwards;animation-delay:calc(.9s + var(--i)*.04s)}
@keyframes flip{from{opacity:0;transform:rotateX(-100deg) translateY(20px)}}
.squig{width:min(220px,50vw);height:16px;margin-top:-14px;overflow:visible}
.squig path{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s 1.7s ease-out forwards}
.cta{position:relative;display:inline-flex;align-items:center;gap:12px;padding:16px 34px;border-radius:999px;color:#fff;font-family:var(--font-h);font-weight:700;font-size:1.2rem;
  background:linear-gradient(110deg,var(--teal),var(--blue),var(--magenta),var(--amber),var(--teal));background-size:300% 100%;
  box-shadow:0 6px 0 #26397A,0 22px 30px -10px rgba(47,125,225,.55);text-shadow:0 1px 2px rgba(0,0,0,.25);
  animation:flow 6s linear infinite,ctaIn .8s 1.7s cubic-bezier(.2,.9,.3,1.3) backwards;transition:transform .15s,box-shadow .15s}
@keyframes flow{to{background-position:-300% 0}}
@keyframes ctaIn{from{opacity:0;transform:translateY(30px) scale(.7)}}
.cta::before{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid var(--blue);animation:ring 2.4s 2.5s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.28,1.7);opacity:0}}
.shine{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.shine::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sweep 3.2s 2.5s ease-in-out infinite}
@keyframes sweep{0%{left:-60%}55%,100%{left:130%}}
.arr{display:inline-block;animation:nudge 1.3s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
.cta:hover{transform:translateY(-3px);box-shadow:0 9px 0 #26397A,0 28px 34px -10px rgba(47,125,225,.6)}
.cta:active{transform:translateY(5px);box-shadow:0 1px 0 #26397A,0 8px 14px -8px rgba(47,125,225,.6)}
.foot{max-width:560px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink2);font-size:.98rem;animation:fade .8s 2s backwards}
.foot b{color:var(--ink);font-weight:600}
@keyframes fade{from{opacity:0}}

/* ---------- shared UI ---------- */
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;background:rgba(255,255,255,.9);border:1px solid var(--line);
  font-weight:600;font-size:.98rem;box-shadow:0 3px 0 var(--line);transition:transform .15s,box-shadow .15s;text-decoration:none;color:var(--ink);white-space:nowrap}
.pill:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--line)}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:9px 22px;border-radius:14px;font-family:var(--font-h);font-weight:700;font-size:1rem;color:#fff;transition:transform .15s,box-shadow .15s;text-decoration:none;align-self:start;justify-self:start}
.btn.main{background:linear-gradient(120deg,var(--teal),var(--blue));box-shadow:0 5px 0 #1D4E9C}
.btn.ghost{background:#EEEAF7;color:var(--ink);box-shadow:0 5px 0 #D9D3EA}
.btn.danger{background:var(--bad);box-shadow:0 5px 0 #8F2621}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn:disabled{opacity:.7;pointer-events:none}
.spinner{width:18px;height:18px;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.spinner.dark{border-color:rgba(27,39,69,.2);border-top-color:var(--blue);width:34px;height:34px}
.wa{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:14px;background:#128C4B;color:#fff;font-weight:600;text-decoration:none;
  box-shadow:0 4px 0 #0B6136;transition:transform .15s,box-shadow .15s}
.wa:hover{transform:translateY(-2px)}
.wa:active{transform:translateY(3px);box-shadow:0 1px 0 #0B6136}
.wa.big{padding:14px 20px;font-size:1.1rem;font-family:var(--font-h);font-weight:700;border-radius:16px}
.wa.mini{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 3px 0 var(--line);padding:9px 18px;border-radius:999px}
.wa.mini:hover{background:#128C4B;color:#fff;border-color:#128C4B}
.link{text-decoration:underline;color:var(--blue);font-weight:600}

.page{position:relative;min-height:100svh}
.view{animation:viewIn .55s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes viewIn{from{opacity:0;transform:perspective(1200px) rotateY(5deg) translate3d(24px,0,0)}}
.bar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(246,244,251,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(230,226,241,.9)}
.bar>:first-child{justify-self:start}
.bar-r{justify-self:end;display:flex;gap:8px}
.brand{font-family:var(--font-h);font-weight:800;font-size:1.3rem}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 130px}
.wrap.narrow{max-width:760px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 20px}
.head h1{font-family:var(--font-h);font-size:clamp(1.7rem,4.6vw,2.4rem);font-weight:800;line-height:1.1}
.count{background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:600;color:var(--ink2);font-size:.95rem}
.adminchip{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--ink2);flex-wrap:wrap}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:66px;height:66px;border-radius:50%;display:grid;place-items:center;color:#fff;z-index:30;
  background:linear-gradient(135deg,var(--magenta),var(--amber));box-shadow:0 6px 0 #9B1F5B,0 20px 30px -8px rgba(214,51,127,.55);
  animation:fabIn .7s .3s cubic-bezier(.2,.9,.3,1.5) backwards;transition:transform .15s,box-shadow .15s}
@keyframes fabIn{from{transform:scale(0) rotate(-180deg)}}
.fab::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--magenta);animation:ring 2.4s ease-out infinite}
.fab svg{transition:transform .35s}
.fab:hover svg{transform:rotate(90deg)}
.fab:active{transform:translateY(5px);box-shadow:0 1px 0 #9B1F5B}
.morewrap{display:grid;justify-items:center;margin-top:26px}

/* ---------- product cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.card,.rev{--ty:0px;position:relative;background:#fff;border-radius:24px;
  box-shadow:0 10px 24px -14px rgba(27,39,69,.35),0 2px 6px rgba(27,39,69,.06);
  transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty));
  transition:transform .2s ease-out,box-shadow .25s;animation:cardIn .7s cubic-bezier(.2,.9,.3,1.15) backwards;animation-delay:calc(var(--i)*70ms)}
.card:hover,.rev:hover{--ty:-6px;box-shadow:0 26px 40px -20px rgba(27,39,69,.45)}
@keyframes cardIn{from{opacity:0;transform:perspective(900px) rotateX(-40deg) translateY(50px) scale(.9)}}
.card{display:flex;flex-direction:column;overflow:hidden}
.ph{position:relative;aspect-ratio:1;background:#EFEBF7;overflow:hidden}
.ph .open{position:absolute;inset:0;width:100%}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.card:hover .ph img{transform:scale(1.07)}
.card.out .ph img{filter:grayscale(.7) brightness(.96)}
.adm{position:absolute;top:10px;right:10px;display:flex;gap:8px;z-index:2}
.rnd{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 4px 10px rgba(27,39,69,.25);transition:transform .15s}
.rnd:hover{transform:scale(1.1)}
.rnd.bad{color:var(--bad)}
.cnt{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:rgba(27,39,69,.72);color:#fff;font-size:.8rem;pointer-events:none}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.st{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:.85rem;font-weight:600}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st.ok{background:#DDF5EA;color:#0E7A4E}
.st.out{background:#FBE1DF;color:#B32F29}
.card h3{font-family:var(--font-h);font-size:1.15rem;font-weight:700;line-height:1.25}
.card h3 .open{text-align:left}
.pr{font-family:var(--font-h);font-weight:800;font-size:1.3rem}
.ds{color:var(--ink2);font-size:.95rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.cb>.wa{margin-top:auto}
.sk{aspect-ratio:3/4;border-radius:24px;background:linear-gradient(100deg,#ECE8F5 30%,#F8F6FC 50%,#ECE8F5 70%);background-size:300% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}
.empty{grid-column:1/-1;display:grid;justify-items:center;gap:14px;text-align:center;padding:50px 10px;color:var(--ink2)}
.empty h2{font-family:var(--font-h);color:var(--ink);font-size:1.5rem}
.empty .bob{width:auto;height:auto}

/* ---------- reviews ---------- */
.rgrid{columns:290px;column-gap:18px}
.rev{break-inside:avoid;margin-bottom:18px;padding:14px 14px 16px;display:block}
.rp{display:grid;gap:4px;border-radius:16px;overflow:hidden;grid-template-columns:repeat(2,1fr);margin-bottom:12px}
.rp.n1{grid-template-columns:1fr}
.rp button{aspect-ratio:1;overflow:hidden;background:#EFEBF7;cursor:zoom-in}
.rp.n3 button:first-child{grid-column:1/-1;aspect-ratio:2/1}
.rp img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.rp button:hover img{transform:scale(1.08)}
.rev blockquote{padding:0 6px;font-size:1.02rem;white-space:pre-wrap;overflow-wrap:anywhere}
.rev blockquote::before{content:"\201C";display:block;font-family:var(--font-h);font-weight:800;font-size:3.4rem;line-height:.75;height:.45em;color:var(--magenta)}
.rev footer{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:600}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--magenta));color:#fff;display:grid;place-items:center;font-family:var(--font-h);font-weight:700}
.rev .adm2{margin-left:auto;display:flex;gap:8px}
.rev .rnd{border:1px solid var(--line);box-shadow:none;width:34px;height:34px}

/* ---------- about ---------- */
.about{background:#fff;border-radius:30px;padding:34px 26px 30px;text-align:center;box-shadow:0 20px 40px -26px rgba(27,39,69,.4);display:grid;justify-items:center;gap:14px}
.about h1{font-family:var(--font-h);font-size:clamp(1.8rem,5vw,2.5rem);font-weight:800}
.about p{color:var(--ink2);font-size:1.08rem;max-width:56ch}
.about .ballwrap{width:120px;height:120px;animation:bob 6s ease-in-out infinite}

/* ---------- dialogs ---------- */
.ov,.lb{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(27,39,69,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s both}
.lb{z-index:70;background:rgba(10,14,30,.9);cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:14px;animation:pop .4s cubic-bezier(.2,.9,.3,1.2) both}
.lb .x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px}
.dlg{position:relative;width:min(430px,100%);max-height:calc(100svh - 32px);overflow:auto;background:#fff;border-radius:28px;box-shadow:0 40px 80px -30px rgba(0,0,0,.5);
  animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:50% 100%}
.dlg.wide{width:min(940px,100%)}
.dlg:focus{outline:0}
@keyframes pop{from{opacity:0;transform:perspective(900px) rotateX(-18deg) translateY(30px) scale(.94)}}
.x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:#F1EEF8;display:grid;place-items:center;z-index:3;color:var(--ink)}
.dlg.small{padding:30px 26px 26px}
.dlg..dlg.small form,.dlg.small .cf{display:grid;gap:16px;align-content:start}
.dlg h2{font-family:var(--font-h);font-size:1.6rem;font-weight:800;line-height:1.2}
.cf p{color:var(--ink2);overflow-wrap:anywhere}
.cf .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--bad);min-height:1.4em;font-weight:500}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pd{display:grid;grid-template-columns:1.05fr 1fr}
.gal{padding:16px;display:flex;flex-direction:column;gap:10px}
.main{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;background:#EFEBF7}
.main img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.thumbs button{aspect-ratio:1;border-radius:12px;overflow:hidden;border:3px solid transparent;opacity:.7;transition:.2s}
.thumbs button[aria-current=true]{border-color:var(--blue);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info{padding:34px 26px 26px 10px;display:flex;flex-direction:column;gap:12px}
.info h2{font-size:1.9rem;overflow-wrap:anywhere}
.info .pr{font-size:1.7rem}
.det{white-space:pre-wrap;color:var(--ink2);overflow-wrap:anywhere}
.info .wa{margin-top:auto}

/* ---------- forms ---------- */
.formcard{background:#fff;border-radius:28px;padding:22px;box-shadow:0 20px 40px -26px rgba(27,39,69,.4);display:grid;gap:22px;align-content:start}
.fld{display:grid;gap:8px}
.fld>label,.lab{font-weight:600}
.lab small{color:var(--ink2);font-weight:500;margin-left:6px}
.in{width:100%;padding:13px 15px;border:2px solid var(--line);border-radius:14px;background:#fff;font:inherit;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.in:focus,.price:focus-within{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,125,225,.18)}
textarea.in{min-height:130px;resize:vertical}
.in.bad{border-color:var(--bad)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.slot{position:relative;aspect-ratio:1;border-radius:16px;border:2px dashed #C9C2DD;background:#FAF8FE;display:grid;place-items:center;color:var(--ink2);overflow:hidden;transition:transform .2s,border-color .2s,color .2s}
button.slot:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-3px) rotate(-2deg)}
.slot:has(img){border-style:solid;border-color:var(--line)}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .rm{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(27,39,69,.82);color:#fff;display:grid;place-items:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{padding:12px;border-radius:14px;border:2px solid var(--line);font-weight:600;background:#fff;transition:.2s}
.seg button[aria-checked=true].ok{background:#DDF5EA;border-color:var(--ok);color:#0E7A4E}
.seg button[aria-checked=true].out{background:#FBE1DF;border-color:var(--bad);color:#B32F29}
.price{display:flex;align-items:stretch;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.price span{display:grid;place-items:center;padding:0 16px;background:#F1EEF8;font-family:var(--font-h);font-weight:800;font-size:1.3rem}
.price input{flex:1;border:0;padding:13px 15px;font:inherit;color:var(--ink);min-width:0;outline:0;background:transparent}

#toasts{position:fixed;left:0;right:0;bottom:calc(100px + env(safe-area-inset-bottom));display:grid;justify-items:center;gap:8px;z-index:90;pointer-events:none;padding:0 12px}
.toast{padding:12px 18px;border-radius:14px;background:var(--ink);color:#fff;font-weight:500;box-shadow:0 14px 30px -10px rgba(0,0,0,.4);animation:toastIn .35s cubic-bezier(.2,.9,.3,1.3) both;max-width:min(92vw,440px)}
.toast.err{background:#B32F29}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.9)}}

@media(max-width:720px){
  .pd{grid-template-columns:1fr}
  .info{padding:6px 18px 22px}

}

}

  .wa{padding:9px 10px;font-size:.9rem}

}

}

}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + type; t.textContent = msg;

  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 320); }, 3200);

function busy(btn, on) {
  if (on) { btn._h = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Saving…'; }
  else { btn.disabled = false; if (btn._h) btn.innerHTML = btn._h; }

/* =====================================================================
   IMAGE COMPRESSION (keeps photos small so 2000 products stay fast)
   ===================================================================== */
function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Could not read this image')); i.src = src; });
}
async function shrink(input, max, q) {
  let url = input, made = false;
  if (input instanceof Blob) { url = URL.createObjectURL(input); made = true; }
  try {
    const i = await loadImg(url);
    const k = Math.min(1, max / Math.max(i.naturalWidth, i.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(i.naturalWidth * k)); c.height = Math.max(1, Math.round(i.naturalHeight * k));
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(i, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  } finally { if (made) URL.revokeObjectURL(url); }
}
const sizeOf = a => a.reduce((n, s) => n + s.length, 0);
async function fitImages(list, budget, levels) {
  if (sizeOf(list) <= budget) return list;
  let out = list;
  for (const [max, q] of levels) {
    out = await Promise.all(out.map(s => shrink(s, max, q)));
    if (sizeOf(out) <= budget) return out;
  }
  throw new Error('These photos are too large. Please choose smaller photos.');
}

/* =====================================================================
   STORAGE  — this device (IndexedDB) or online (Firebase Firestore)
   ===================================================================== */
const IDBStore = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('roystores_v1', 1);
    r.onupgradeneeded = () => { ['products', 'productImages', 'reviews'].forEach(n => r.result.createObjectStore(n, { keyPath: 'id' })); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = async (name, mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(name, mode); const q = fn(t.objectStore(name));
      t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  };
  return {
    list: col => run(col, 'readonly', s => s.getAll()).then(a => a.sort((x, y) => y.createdAt - x.createdAt)),
    put: (col, doc) => run(col, 'readwrite', s => s.put(doc)),
    getImages: async id => ((await run('productImages', 'readonly', s => s.get(id))) || {}).images || [],
    putImages: (id, images) => run('productImages', 'readwrite', s => s.put({ id, images })),
    remove: async (col, id) => { await run(col, 'readwrite', s => s.delete(id)); if (col === 'products') await run('productImages', 'readwrite', s => s.delete(id)); }
  };
})();

const makeFBStore = cfg => {
  firebase.initializeApp(cfg);
  const db = firebase.firestore();
  return {
    list: async col => (await db.collection(col).orderBy('createdAt', 'desc').get()).docs.map(d => ({ ...d.data(), id: d.id })),
    put: (col, doc) => db.collection(col).doc(doc.id).set(doc),
    getImages: async id => { const d = await db.collection('productImages').doc(id).get(); return d.exists ? d.data().images : []; },
    putImages: (id, images) => db.collection('productImages').doc(id).set({ images }),
    remove: async (col, id) => { await db.collection(col).doc(id).delete(); if (col === 'products') await db.collection('productImages').doc(id).delete(); }
  };
};
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); });
const boot = (async () => {
  if (CONFIG.firebase) {
    try {
      const v = '10.12.2';
      await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);
      await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`);
      return makeFBStore(CONFIG.firebase);
    } catch (e) {
      console.error(e);
      setTimeout(() => toast('Could not connect to the online database. Using this device only.', 'err'), 600);
    }
  }
  return IDBStore;
})();

const state = { products: [], reviews: [], loaded: {}, pending: {}, shown: { products: 24, reviews: 18 } };
const imgCache = new Map();
async function ensure(col) {
  if (state.loaded[col]) return;
  if (!state.pending[col]) {
    state.pending[col] = boot.then(S => S.list(col)).then(a => { state[col] = a; state.loaded[col] = true; }).finally(() => { state.pending[col] = null; });
  }
  return state.pending[col];
}
async function getImgs(id) {
  if (imgCache.has(id)) return imgCache.get(id);
  const a = await (await boot).getImages(id); imgCache.set(id, a); return a;
}

function tilt(root, sel) {
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  root.addEventListener('pointermove', e => {
    const c = e.target.closest(sel); if (!c) return;
    const r = c.getBoundingClientRect();
    c.style.setProperty('--ry', (((e.clientX - r.left) / r.width - .5) * 10).toFixed(2) + 'deg');
    c.style.setProperty('--rx', ((-((e.clientY - r.top) / r.height - .5)) * 10).toFixed(2) + 'deg');
  });
  root.addEventListener('pointerout', e => {
    const c = e.target.closest(sel);
    if (c && !c.contains(e.relatedTarget)) { c.style.setProperty('--rx', '0deg'); c.style.setProperty('--ry', '0deg'); }
  });
}

/* =====================================================================
   DIALOGS
   ===================================================================== */
let lastFocus = null;
function modal(inner, cls = '') {
  closeModal();
  lastFocus = document.activeElement;
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="dlg ${cls}" role="dialog" aria-modal="true" tabindex="-1"><button class="x" data-close aria-label="Close">${ico('close', 20)}</button>${inner}</div>`;
  ov.addEventListener('pointerdown', e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov); document.body.style.overflow = 'hidden';
  $$('[data-close]', ov).forEach(b => b.onclick = closeModal);
  $('.dlg', ov).focus();
  return ov;
}
function closeModal() {
  const ov = $('.ov'); if (!ov) return;
  ov.remove(); if (!$('.lb')) document.body.style.overflow = '';
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
function openLightbox(src) {
  const lb = document.createElement('div'); lb.className = 'lb';
  lb.innerHTML = `<img src="${esc(src)}" alt=""><button class="x" aria-label="Close">${ico('close', 22)}</button>`;
  lb.onclick = () => closeLb(lb);
  document.body.appendChild(lb); document.body.style.overflow = 'hidden';
}
function closeLb(lb) { lb.remove(); if (!$('.ov')) document.body.style.overflow = ''; }
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const lb = $('.lb'); if (lb) closeLb(lb); else closeModal();
});

/* =====================================================================
   AUTH
   ===================================================================== */
function openLogin() {
  const ov = modal(`<form novalidate><h2>Admin Login</h2>
    <div class="fld"><label for="lid">ID</label><input class="in" id="lid" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="fld"><label for="lpw">Password</label><input class="in" id="lpw" type="password" autocomplete="off"></div>
    <p class="err" id="lerr" role="alert"></p>
    <button class="btn main" type="submit">${ico('lock', 20)} Login</button></form>`, 'small');
  setTimeout(() => $('#lid', ov).focus(), 60);
  $('form', ov).onsubmit = e => {
    e.preventDefault();
    const id = $('#lid', ov).value.trim().toLowerCase(), pw = $('#lpw', ov).value;
    if (id === CONFIG.admin.id.toLowerCase() && pw === CONFIG.admin.password) {
      sessionStorage.setItem('rs_admin', '1');
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
      closeModal(); toast('Welcome, ' + CONFIG.admin.id); nav('/shop');
    } else {
      $('#lerr', ov).textContent = 'Wrong ID or password. Please try again.';
      const d = $('.dlg', ov); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
    }
  };
}

function viewHome() {
  const page = document.createElement('section'); page.className = 'home';

      <path class="th" pathLength="1" stroke="url(#tg)" d="M-20 820 C 150 640, 260 980, 430 820 S 700 560, 1020 640"/>
      <path class="th t2" pathLength="1" stroke="url(#tg)" d="M-20 180 C 180 300, 300 60, 520 200 S 820 340, 1020 160"/>
    </svg>
    <div class="home-top"><button class="pill" id="adminBtn">${isAdmin() ? ico('logout') + '<span>Logout</span>' : ico('lock') + '<span>Admin Login</span>'}</button></div>
    <div class="home-mid">
      <div class="logo-stage"><div class="logo-float">
        <span class="orbit"><i style="--c:#14B8D0;top:-7px;left:50%"></i><i style="--c:#D6337F;bottom:12%;right:-7px"></i><i style="--c:#F2A33A;bottom:-7px;left:22%"></i></span>
        <div class="logo-card" id="logoCard"><img src="${esc(CONFIG.logo)}" alt="Logo" width="300" height="300"></div>
      </div></div>
      <h1 class="welcome" aria-label="Welcome To Roy Stores">${letters}</h1>
      <svg class="squig" viewBox="0 0 220 16" aria-hidden="true"><defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#14B8D0"/><stop offset=".5" stop-color="#D6337F"/><stop offset="1" stop-color="#F2A33A"/></linearGradient></defs><path pathLength="1" stroke="url(#sg)" d="M4 9 Q 22 -1 40 9 T 76 9 T 112 9 T 148 9 T 184 9 T 216 9"/></svg>
      <button class="cta" id="goShop"><span class="shine"></span><span>Continue Shopping</span><span class="arr" aria-hidden="true">→</span></button>
    </div>
    <footer class="foot">
      <p>This Website is designed and hosted by <b>Digital Studio</b>.</p>
      <p>Want your own website? Contact here:</p>
      <a class="wa mini" target="_blank" rel="noopener" href="${wa(CONFIG.studioWhatsApp, 'Hello Digital Studio! I saw the Roy Stores website and I want my own website.')}">${ico('phone', 18)} Contact</a>
    </footer>`;
  $('#adminBtn', page).onclick = () => isAdmin() ? logout() : openLogin();
  $('#goShop', page).onclick = () => nav('/shop');
  return page;
}

/* ---- Shop ---- */
function cardHTML(p, i, admin) {
  const out = p.status === 'out';
  return `<article class="card ${out ? 'out' : ''}" data-id="${esc(p.id)}" style="--i:${Math.min(i, 10)}">
    <div class="ph"><button class="open" aria-label="View ${esc(p.name)}"><img src="${esc(p.thumb)}" alt="${esc(p.name)}" loading="lazy" decoding="async"></button>
      ${admin ? `<div class="adm"><button class="rnd" data-edit="product:${esc(p.id)}" aria-label="Edit ${esc(p.name)}">${ico('edit', 18)}</button><button class="rnd bad" data-del="product:${esc(p.id)}" aria-label="Delete ${esc(p.name)}">${ico('trash', 18)}</button></div>` : ''}
      ${p.imgCount > 1 ? `<span class="cnt">${ico('image', 14)} ${p.imgCount}</span>` : ''}</div>
    <div class="cb"><span class="st ${out ? 'out' : 'ok'}">${out ? 'Out of Stock' : 'Available'}</span>
      <h3><button class="open">${esc(p.name)}</button></h3>
      <p class="pr">${priceTxt(p)}</p>
      ${p.details ? `<p class="ds">${esc(p.details)}</p>` : ''}
      <a class="wa" target="_blank" rel="noopener" href="${waProduct(p.name)}">${ico('phone', 18)} Contact us</a></div></article>`;
}
function emptyHTML(kind, admin) {
  const txt = kind === 'products'
    ? (admin ? ['No products yet', 'Tap the + button to add your first product.'] : ['New products are on the way', 'Please check back soon.'])
    : (admin ? ['No reviews yet', 'Tap the + button to add your first customer review.'] : ['No reviews yet', 'Customer reviews will appear here.']);
  return `<div class="empty"><div class="bob">${ballHTML(96, '#D6337F', '#F27DB3')}</div><h2>${txt[0]}</h2><p>${txt[1]}</p></div>`;
}
function paintProducts(page, reset) {
  const grid = $('#grid', page), more = $('#more', page), cnt = $('#cnt', page);
  const list = state.products, admin = isAdmin();
  cnt.hidden = !list.length; cnt.textContent = list.length + (list.length === 1 ? ' item' : ' items');
  if (reset) { grid.innerHTML = ''; grid._n = 0; }
  if (!list.length) { grid.innerHTML = emptyHTML('products', admin); more.innerHTML = ''; return; }
  const upto = Math.min(list.length, state.shown.products);
  grid.insertAdjacentHTML('beforeend', list.slice(grid._n || 0, upto).map((p, i) => cardHTML(p, i, admin)).join(''));
  grid._n = upto;
  more.innerHTML = upto < list.length ? '<button class="btn ghost" data-more="products">Show more</button>' : '';
}
function viewShop() {
  const admin = isAdmin(); state.shown.products = 24;
  const page = shell('/', `<main class="wrap"><div class="head"><h1>All Products</h1><span class="count" id="cnt" hidden></span>${admin ? adminChip() : ''}</div><div class="grid" id="grid"></div><div class="morewrap" id="more"></div></main>`,
    pAbout + pRev, admin ? fab('/admin/product', 'Add product') : '');
  const grid = $('#grid', page);
  grid.innerHTML = Array.from({ length: 6 }, () => '<div class="sk"></div>').join('');
  ensure('products').then(() => paintProducts(page, true)).catch(err => {
    console.error(err);
    grid.innerHTML = '<div class="empty"><h2>Could not load products</h2><p>Please check your internet connection.</p><button class="btn main" data-retry>Try again</button></div>';
  });
  tilt(grid, '.card');
  return page;
}
async function openProduct(id) {
  const p = state.products.find(x => x.id === id); if (!p) return;
  const out = p.status === 'out';
  const ov = modal(`<div class="pd"><div class="gal"><div class="main"><img id="mi" src="${esc(p.thumb)}" alt="${esc(p.name)}"></div><div class="thumbs" id="th"></div></div>
    <div class="info"><span class="st ${out ? 'out' : 'ok'}">${out ? 'Out of Stock' : 'Available'}</span><h2>${esc(p.name)}</h2><p class="pr">${priceTxt(p)}</p>
    ${p.details ? `<p class="det">${esc(p.details)}</p>` : ''}
    <a class="wa big" target="_blank" rel="noopener" href="${waProduct(p.name)}">${ico('phone', 20)} Contact us</a></div></div>`, 'wide');
  let imgs;
  try { imgs = await getImgs(id); } catch (e) { console.error(e); return; }
  if (!ov.isConnected || !imgs.length) return;
  const mi = $('#mi', ov), th = $('#th', ov);
  const show = i => { mi.src = imgs[i]; $$('button', th).forEach((b, j) => b.setAttribute('aria-current', j === i)); };
  if (imgs.length > 1) {
    th.innerHTML = imgs.map((s, i) => `<button aria-label="Photo ${i + 1}"><img src="${esc(s)}" alt=""></button>`).join('');
    $$('button', th).forEach((b, i) => b.onclick = () => show(i)); show(0);
  } else mi.src = imgs[0];
  mi.onclick = () => openLightbox(mi.src);
}

/* ---- Reviews ---- */
function reviewHTML(r, i, admin) {
  const ph = r.photos || [];
  return `<article class="rev" data-id="${esc(r.id)}" style="--i:${Math.min(i, 8)}">
    ${ph.length ? `<div class="rp n${ph.length}">${ph.map((s, j) => `<button data-lb="${esc(r.id)}|${j}" aria-label="Open photo ${j + 1}"><img src="${esc(s)}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}
    <blockquote>${esc(r.text)}</blockquote>
    <footer><span class="av" aria-hidden="true">${esc([...r.name][0] || '?')}</span><span>${esc(r.name)}</span>
      ${admin ? `<span class="adm2"><button class="rnd" data-edit="review:${esc(r.id)}" aria-label="Edit review">${ico('edit', 16)}</button><button class="rnd bad" data-del="review:${esc(r.id)}" aria-label="Delete review">${ico('trash', 16)}</button></span>` : ''}</footer></article>`;
}
function paintReviews(page, reset) {
  const grid = $('#grid', page), more = $('#more', page), cnt = $('#cnt', page);
  const list = state.reviews, admin = isAdmin();
  cnt.hidden = !list.length; cnt.textContent = list.length + (list.length === 1 ? ' review' : ' reviews');
  if (reset) { grid.innerHTML = ''; grid._n = 0; }
  if (!list.length) { grid.innerHTML = emptyHTML('reviews', admin); more.innerHTML = ''; return; }
  const upto = Math.min(list.length, state.shown.reviews);
  grid.insertAdjacentHTML('beforeend', list.slice(grid._n || 0, upto).map((r, i) => reviewHTML(r, i, admin)).join(''));
  grid._n = upto;
  more.innerHTML = upto < list.length ? '<button class="btn ghost" data-more="reviews">Show more</button>' : '';
}
function viewReviews() {
  const admin = isAdmin(); state.shown.reviews = 18;
  const page = shell('/shop', `<main class="wrap"><div class="head"><h1>Customer Reviews</h1><span class="count" id="cnt" hidden></span>${admin ? adminChip() : ''}</div><div class="rgrid" id="grid"></div><div class="morewrap" id="more"></div></main>`,
    pAbout, admin ? fab('/admin/review', 'Add review') : '');
  const grid = $('#grid', page);
  grid.innerHTML = '<div class="empty"><span class="spinner dark"></span></div>';
  ensure('reviews').then(() => paintReviews(page, true)).catch(err => {
    console.error(err);
    grid.innerHTML = '<div class="empty"><h2>Could not load reviews</h2><p>Please check your internet connection.</p><button class="btn main" data-retry>Try again</button></div>';
  });
  tilt(grid, '.rev');
  return page;
}

/* ---- About ---- */
function viewAbout() {
  return shell('/shop', `<main class="wrap narrow"><article class="about"><div class="ballwrap">${ballHTML(120, '#14B8D0', '#7BE0EE')}</div>
    <h1>${esc(ABOUT_US.title)}</h1>${ABOUT_US.paragraphs.map(p => `<p>${esc(p)}</p>`).join('')}
    <a class="wa big" target="_blank" rel="noopener" href="${wa(CONFIG.shopWhatsApp, 'Hello Roy Stores!')}">${ico('phone', 20)} Contact us</a></article></main>`, pRev);
}

/* ---- Admin forms ---- */
function slotsUI(host, imgs, max, onChange) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true; inp.hidden = true; host.after(inp);
  const paint = () => {
    host.innerHTML = imgs.map((im, i) => `<div class="slot"><img src="${esc(im.src)}" alt="Image ${i + 1}"><button type="button" class="rm" data-rm="${i}" aria-label="Remove image ${i + 1}">${ico('close', 16)}</button></div>`).join('') +
      Array.from({ length: max - imgs.length }, () => `<button type="button" class="slot add" aria-label="Add image">${ico('plus', 26)}</button>`).join('');
    onChange && onChange();
  };
  host.addEventListener('click', e => {
    const rm = e.target.closest('[data-rm]'); if (rm) { imgs.splice(+rm.dataset.rm, 1); paint(); return; }
    if (e.target.closest('.add')) inp.click();
  });
  inp.onchange = async () => {
    const files = [...inp.files]; inp.value = '';
    const room = max - imgs.length;
    if (files.length > room) toast(`You can add only ${max} images`, 'err');
    for (const f of files.slice(0, room)) {
      try { imgs.push({ src: await shrink(f, max === 4 && host.dataset.kind === 'review' ? 700 : 1000, .72) }); paint(); }
      catch (e) { toast('Could not read ' + f.name, 'err'); }
    }
  };
  paint();
}

function viewProductForm(id) {
  const page = shell('/shop', '<main class="wrap narrow" id="fm"><div class="empty"><span class="spinner dark"></span></div></main>', '', '', id ? 'Edit Product' : 'Add Product');
  (async () => {
    try { await ensure('products'); } catch (e) { console.error(e); toast('Could not load products', 'err'); nav('/shop'); return; }
    const ed = id ? state.products.find(p => p.id === id) : null;
    if (id && !ed) { toast('Product not found', 'err'); nav('/shop'); return; }
    let imgs = [];
    if (ed) { try { imgs = (await getImgs(id)).map(src => ({ src })); } catch (e) { console.error(e); } }
    if (!page.isConnected) return;
    const host = $('#fm', page);
    host.innerHTML = `<div class="head"><h1>${ed ? 'Edit Product' : 'Add Product'}</h1></div><div class="formcard">
      <div class="fld"><span class="lab">Add Image<small id="ic"></small></span><div class="slots" id="slots"></div></div>
      <div class="fld"><label for="pn">Product Name</label><input class="in" id="pn" maxlength="120" value="${esc(ed ? ed.name : '')}"></div>
      <div class="fld"><span class="lab">Product Status</span><div class="seg" role="radiogroup" aria-label="Product status"><button type="button" role="radio" class="ok" data-s="available">Available</button><button type="button" role="radio" class="out" data-s="out">Out of Stock</button></div></div>
      <div class="fld"><label for="pd">Product Details</label><textarea class="in" id="pd" maxlength="2000">${esc(ed ? ed.details : '')}</textarea></div>
      <div class="fld"><label for="pp">Product Price</label><div class="price"><span>₹</span><input id="pp" inputmode="decimal" maxlength="12" value="${esc(ed ? ed.price : '')}"></div></div>
      <a class="wa big" id="pw" target="_blank" rel="noopener">${ico('phone', 20)} Contact us</a>
      <button class="btn main" id="sv">Save</button></div>`;
    const pn = $('#pn', host), pd = $('#pd', host), pp = $('#pp', host), pw = $('#pw', host), sv = $('#sv', host), ic = $('#ic', host);
    let status = ed ? ed.status : 'available';
    const paintSeg = () => $$('.seg button', host).forEach(b => b.setAttribute('aria-checked', b.dataset.s === status));
    $$('.seg button', host).forEach(b => b.onclick = () => { status = b.dataset.s; paintSeg(); }); paintSeg();
    slotsUI($('#slots', host), imgs, 4, () => { ic.textContent = `${imgs.length}/4`; });
    const link = () => { pw.href = waProduct(pn.value.trim() || 'this product'); }; link();
    pn.oninput = () => { pn.classList.remove('bad'); link(); };
    pp.oninput = () => { pp.value = pp.value.replace(/[^0-9.,]/g, ''); };
    sv.onclick = async () => {
      const name = pn.value.trim();
      if (!name) { pn.classList.add('bad'); pn.focus(); toast('Please enter the product name', 'err'); return; }
      if (!imgs.length) { toast('Please add at least one image', 'err'); return; }
      if (!ed && state.products.length >= CONFIG.limits.products) { toast(`Limit reached: ${CONFIG.limits.products} products`, 'err'); return; }
      busy(sv, true);
      try {
        const S = await boot, pid = ed ? ed.id : uid();
        const full = await fitImages(imgs.map(i => i.src), 900000, [[1000, .72], [860, .62], [720, .55], [600, .5]]);
        const thumb = await shrink(full[0], 480, .72);
        const doc = { id: pid, name, status, details: pd.value.trim(), price: pp.value.trim(), thumb, imgCount: full.length, createdAt: ed ? ed.createdAt : Date.now(), updatedAt: Date.now() };
        await S.putImages(pid, full); await S.put('products', doc);
        imgCache.set(pid, full);
        const k = state.products.findIndex(p => p.id === pid);
        if (k >= 0) state.products[k] = doc; else state.products.unshift(doc);
        toast(ed ? 'Product updated' : 'Product saved'); nav('/shop');
      } catch (e) { console.error(e); toast(e.message || 'Could not save. Please try again.', 'err'); busy(sv, false); }
    };
  })();
  return page;
}

function viewReviewForm(id) {
  const page = shell('/reviews', '<main class="wrap narrow" id="fm"><div class="empty"><span class="spinner dark"></span></div></main>', '', '', id ? 'Edit Review' : 'Add Review');
  (async () => {
    try { await ensure('reviews'); } catch (e) { console.error(e); toast('Could not load reviews', 'err'); nav('/reviews'); return; }
    const ed = id ? state.reviews.find(r => r.id === id) : null;
    if (id && !ed) { toast('Review not found', 'err'); nav('/reviews'); return; }
    const imgs = ed ? (ed.photos || []).map(src => ({ src })) : [];
    if (!page.isConnected) return;
    const host = $('#fm', page);
    host.innerHTML = `<div class="head"><h1>${ed ? 'Edit Review' : 'Add Review'}</h1></div><div class="formcard">
      <div class="fld"><label for="cn">Customer Name</label><input class="in" id="cn" maxlength="80" value="${esc(ed ? ed.name : '')}"></div>
      <div class="fld"><span class="lab">Customer Product Photos<small id="ic"></small></span><div class="slots" id="slots" data-kind="review"></div></div>
      <div class="fld"><label for="cr">Customer Review</label><textarea class="in" id="cr" maxlength="1500">${esc(ed ? ed.text : '')}</textarea></div>
      <button class="btn main" id="sv">Save</button></div>`;
    const cn = $('#cn', host), cr = $('#cr', host), sv = $('#sv', host), ic = $('#ic', host);
    slotsUI($('#slots', host), imgs, 4, () => { ic.textContent = `${imgs.length}/4`; });
    cn.oninput = () => cn.classList.remove('bad'); cr.oninput = () => cr.classList.remove('bad');
    sv.onclick = async () => {
      const name = cn.value.trim(), text = cr.value.trim();
      if (!name) { cn.classList.add('bad'); cn.focus(); toast('Please enter the customer name', 'err'); return; }
      if (!text) { cr.classList.add('bad'); cr.focus(); toast('Please write the review', 'err'); return; }
      if (!ed && state.reviews.length >= CONFIG.limits.reviews) { toast(`Limit reached: ${CONFIG.limits.reviews} reviews`, 'err'); return; }
      busy(sv, true);
      try {
        const S = await boot, rid = ed ? ed.id : uid();
        const photos = await fitImages(imgs.map(i => i.src), 650000, [[700, .7], [600, .6], [500, .5]]);
        const doc = { id: rid, name, text, photos, createdAt: ed ? ed.createdAt : Date.now(), updatedAt: Date.now() };
        await S.put('reviews', doc);
        const k = state.reviews.findIndex(r => r.id === rid);
        if (k >= 0) state.reviews[k] = doc; else state.reviews.unshift(doc);
        toast(ed ? 'Review updated' : 'Review saved'); nav('/reviews');
      } catch (e) { console.error(e); toast(e.message || 'Could not save. Please try again.', 'err'); busy(sv, false); }
    };
  })();
  return page;
}

/* =====================================================================
   ROUTER + EVENTS
   ===================================================================== */
const app = $('#app');
function nav(p) {
  const cur = location.hash.replace(/^#/, '') || '/';
  if (cur === p) render(); else location.hash = p;
}
function render() {
  closeModal();
  const seg = location.hash.replace(/^#/, '').split('/').filter(Boolean);
  let el, home = false;
  if (!seg.length) { home = true; el = viewHome(); }
  else if (seg[0] === 'shop') el = viewShop();
  else if (seg[0] === 'reviews') el = viewReviews();
  else if (seg[0] === 'about') el = viewAbout();
  else if (seg[0] === 'admin' && (seg[1] === 'product' || seg[1] === 'review')) {
    if (!isAdmin()) { location.replace('#/'); return; }
    el = seg[1] === 'product' ? viewProductForm(seg[2]) : viewReviewForm(seg[2]);
  } else { location.replace('#/'); return; }
  document.body.classList.toggle('home', home);
  app.replaceChildren(el);
  scrollTo(0, 0);
}
addEventListener('hashchange', render);

function askDelete(kind, id) {
  const it = (kind === 'product' ? state.products : state.reviews).find(x => x.id === id); if (!it) return;
  const ov = modal(`<div class="cf"><h2>Delete this ${kind}?</h2><p>${esc(it.name)} will be removed for good.</p><div class="row"><button class="btn ghost" data-close>Cancel</button><button class="btn danger" id="yes">Delete</button></div></div>`, 'small');
  $$('[data-close]', ov).forEach(b => b.onclick = closeModal);
  $('#yes', ov).onclick = async e => {
    busy(e.currentTarget, true);
    try {
      await (await boot).remove(kind === 'product' ? 'products' : 'reviews', id);
      if (kind === 'product') { state.products = state.products.filter(x => x.id !== id); imgCache.delete(id); }
      else state.reviews = state.reviews.filter(x => x.id !== id);
      closeModal();
      const page = app.firstElementChild;
      if (kind === 'product') paintProducts(page, true); else paintReviews(page, true);
      toast('Deleted');
    } catch (err) { console.error(err); toast('Could not delete. Please try again.', 'err'); closeModal(); }
  };
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-logout],[data-retry],[data-more],[data-edit],[data-del],[data-lb],.card .open');
  if (!t) return;
  if (t.dataset.go) return nav(t.dataset.go);
  if ('logout' in t.dataset) return logout();
  if ('retry' in t.dataset) return render();
  if (t.dataset.more) {
    state.shown[t.dataset.more] += t.dataset.more === 'products' ? 24 : 18;
    const page = app.firstElementChild;
    return t.dataset.more === 'products' ? paintProducts(page, false) : paintReviews(page, false);
  }
  if (t.dataset.edit) { const [k, id] = t.dataset.edit.split(':'); return nav(`/admin/${k}/${id}`); }
  if (t.dataset.del) { const [k, id] = t.dataset.del.split(':'); return askDelete(k, id); }
  if (t.dataset.lb) {
    const [id, j] = t.dataset.lb.split('|'); const r = state.reviews.find(x => x.id === id);
    if (r && r.photos[+j]) openLightbox(r.photos[+j]); return;
  }
  const card = t.closest('.card'); if (card) openProduct(card.dataset.id);
});

render();
</script>
